name: Security Check

# 依存パッケージの脆弱性とビルドを定期的・PRごとにチェックする。
# 失敗すると GitHub から通知メールが届く（定期実行の場合は cron を最後に変更したユーザー宛て）。
# 注意: 公開リポジトリで 60 日間アクティビティがないと、定期実行は GitHub により自動で無効化される。

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (high 以上で失敗)
        run: npm audit --audit-level=high

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Build
        run: npm run build
